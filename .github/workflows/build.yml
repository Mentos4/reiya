name: Build Reiya APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v3
          restore-keys: buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential libffi-dev libssl-dev \
            openjdk-17-jdk unzip zip \
            autoconf libtool pkg-config cmake \
            libltdl-dev zlib1g-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.33

      - name: Pin p4a python3 recipe to 3.11.9
        run: |
          python3 - <<'PYEOF'
          import os, re, inspect
          import pythonforandroid.recipes.python3 as r
          path = inspect.getfile(r)
          print(f"Patching recipe at: {path}")
          with open(path) as f:
              content = f.read()
          # Show current version
          for line in content.splitlines():
              if 'version' in line.lower() and ('3.' in line or 'url' in line.lower()):
                  print("BEFORE:", line.strip())
          # Pin to 3.11.9
          content = re.sub(
              r"version\s*=\s*['\"][3-9]\.\d+\.\d+['\"]",
              "version = '3.11.9'",
              content
          )
          # Remove sha512sum (checksum is version-specific; skip verification)
          content = re.sub(r"\n\s*sha512sum\s*=\s*'[^']*'", "", content)
          with open(path, 'w') as f:
              f.write(content)
          # Verify
          for line in content.splitlines():
              if 'version' in line.lower() and ('3.' in line or 'url' in line.lower()):
                  print("AFTER: ", line.strip())
          print("Recipe patched successfully.")
          PYEOF

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build debug APK
        run: buildozer android debug 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reiya-AccountManager
          path: bin/*.apk
          retention-days: 14
